services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: guest
      POSTGRES_PASSWORD: guest
      POSTGRES_DB: guest_accounting
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guest -d guest_accounting"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://guest:guest@db:5432/guest_accounting?sslmode=disable
      HTTP_ADDR: :8080

volumes:
  db_data:
